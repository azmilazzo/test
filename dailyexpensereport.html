<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantation Plaza Sales Suite</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            display: none;
        }
        .card.active {
            display: block;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #334155;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #475569;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        input::placeholder {
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: normal;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        textarea {
            width: 100%;
            height: 260px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f1f5f9;
            box-sizing: border-box;
            resize: vertical;
        }
        button.action-btn {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.action-btn:hover {
            background-color: #1d4ed8;
        }
        .toast {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #16a34a;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Plantation Plaza Report Suite</h2>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('daily')">Daily Closing Report</button>
        <button class="tab-btn tab-lunch" onclick="switchTab('lunch')">After Lunch Report</button>
    </div>

    <!-- ================= 1. DAILY CLOSING REPORT CARD ================= -->
    <div id="dailyCard" class="card active">
        <div class="section-title">📅 General Info</div>
        <div class="row">
            <div class="form-group">
                <label>Month</label>
                <input type="text" id="dailyMonth" readonly>
            </div>
            <div class="form-group">
                <label>Date (DD/MM/YYYY)</label>
                <input type="text" id="dailyDate" oninput="onDateChange('daily')">
            </div>
        </div>
        <div class="form-group">
            <label>Outlet Name</label>
            <input type="text" id="dailyOutlet" value="PLANTATION PLAZA">
        </div>

        <div class="section-title" style="margin-top: 20px;">💰 Sales & POS Data</div>
        <div class="row">
            <div class="form-group">
                <label>Cash POS Sales ($)</label>
                <input type="number" step="0.01" id="cashPos" placeholder="Cash Sales">
            </div>
            <div class="form-group">
                <label>Total Net Sales ($)</label>
                <input type="number" step="0.01" id="totalNetSales" placeholder="Net Sales">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>GrabFood ($)</label>
                <input type="number" step="0.01" id="grabFood" placeholder="GrabFood">
            </div>
            <div class="form-group">
                <label>FoodPanda ($)</label>
                <input type="number" step="0.01" id="foodPanda" placeholder="PANDA">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Comm. Multiplier</label>
                <input type="number" step="0.01" id="commRate" value="0.68">
            </div>
            <div class="form-group">
                <label>Float Money ($)</label>
                <input type="number" step="0.01" id="floatMoney" value="300">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Prev. MTD In-Store Sales ($)</label>
                <input type="number" step="0.01" id="prevMtdInStore" placeholder="Yesterday's In-Store MTD">
            </div>
            <div class="form-group">
                <label>Prev. MTD Total Sales ($)</label>
                <input type="number" step="0.01" id="prevMtdTotal" placeholder="Yesterday's Total MTD">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Extra ($)</label>
                <input type="number" step="0.01" id="extra" value="0">
            </div>
            <div class="form-group">
                <label>Shortage ($)</label>
                <input type="number" step="0.01" id="shortage" value="0">
            </div>
        </div>

        <div class="section-title" style="margin-top: 20px;">🍚 Rice Inventory</div>
        <div class="row">
            <div class="form-group">
                <label>Yesterday Balance</label>
                <input type="number" step="0.1" id="yestBal" placeholder="Yesterday balance">
            </div>
            <div class="form-group">
                <label>Today Cook</label>
                <input type="number" step="0.1" id="todayCook" placeholder="Today cook">
            </div>
            <div class="form-group">
                <label>Today Used</label>
                <input type="number" step="0.1" id="todayUsed" placeholder="Today used">
            </div>
        </div>

        <div class="section-title" style="margin-top: 20px;">📋 Generated Message Preview</div>
        <div class="form-group">
            <textarea id="outputDaily" readonly></textarea>
        </div>
        <button class="action-btn" onclick="copyToClipboard('outputDaily')">Copy Daily Report</button>
        <div id="toastDaily" class="toast">Successfully copied to clipboard! ✅</div>
    </div>

    <!-- ================= 2. AFTER LUNCH REPORT CARD ================= -->
    <div id="lunchCard" class="card">
        <div class="section-title">📅 General Info</div>
        <div class="row">
            <div class="form-group">
                <label>Date (DD/MM/YYYY)</label>
                <input type="text" id="lunchDate" oninput="onDateChange('lunch')">
            </div>
            <div class="form-group">
                <label>Time</label>
                <input type="text" id="lunchTime">
            </div>
        </div>
        <div class="form-group">
            <label>Outlet</label>
            <input type="text" id="lunchOutlet" value="PPL">
        </div>

        <div class="section-title" style="margin-top: 20px;">🍔 Lunch Sales Data</div>
        <div class="form-group">
            <label>Sales In House ($)</label>
            <input type="number" step="0.01" id="lunchInHouse" placeholder="531.20">
        </div>
        <div class="row">
            <div class="form-group">
                <label>Foodpanda ($)</label>
                <input type="number" step="0.01" id="lunchFoodpanda" placeholder="80.85">
            </div>
            <div class="form-group">
                <label>Grab ($)</label>
                <input type="number" step="0.01" id="lunchGrab" placeholder="109.33">
            </div>
        </div>

        <div class="section-title" style="margin-top: 20px;">⭐ Performance Metrics</div>
        <div class="row">
            <div class="form-group">
                <label>Google Review Rating</label>
                <input type="number" step="0.1" id="lunchRating" value="4.4">
            </div>
            <div class="form-group">
                <label>New Reviews in Month</label>
                <input type="number" id="lunchNewReviews" value="0">
            </div>
        </div>
        <div class="form-group">
            <label>Online Incidents in Month</label>
            <input type="number" id="lunchIncidents" value="0">
        </div>

        <div class="section-title" style="margin-top: 20px;">📋 Generated Message Preview</div>
        <div class="form-group">
            <textarea id="outputLunch" readonly></textarea>
        </div>
        <button class="action-btn" onclick="copyToClipboard('outputLunch')">Copy Lunch Report</button>
        <div id="toastLunch" class="toast">Successfully copied to clipboard! ✅</div>
    </div>
</div>

<script>
    const monthsNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    window.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const monthNum = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        
        const fullDateStr = `${day}/${monthNum}/${year}`;
        
        // Init Daily
        document.getElementById('dailyDate').value = fullDateStr;
        updateMonthField('dailyDate', 'dailyMonth');

        // Init Lunch
        document.getElementById('lunchDate').value = fullDateStr;
        
        // Init Time format e.g. 15:36pm
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        document.getElementById('lunchTime').value = `${hours}:${minutes}${ampm}`;

        generateDailyReport();
        generateLunchReport();
    });

    function onDateChange(type) {
        if(type === 'daily') {
            updateMonthField('dailyDate', 'dailyMonth');
            generateDailyReport();
        } else {
            generateLunchReport();
        }
    }

    function updateMonthField(dateInputId, monthInputId) {
        const val = document.getElementById(dateInputId).value;
        const parts = val.split('/');
        if(parts.length === 3) {
            const mIndex = parseInt(parts[1], 10) - 1;
            const year = parts[2];
            if(!isNaN(mIndex) && mIndex >= 0 && mIndex <= 11) {
                document.getElementById(monthInputId).value = `${monthsNames[mIndex]} ${year}`;
            }
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        
        if(tab === 'daily') {
            document.querySelector('.tab-btn').classList.add('active');
            document.getElementById('dailyCard').classList.add('active');
        } else {
            document.querySelector('.tab-lunch').classList.add('active');
            document.getElementById('lunchCard').classList.add('active');
        }
    }

    document.querySelectorAll('#dailyCard input').forEach(input => {
        input.addEventListener('input', generateDailyReport);
    });
    document.querySelectorAll('#lunchCard input').forEach(input => {
        input.addEventListener('input', generateLunchReport);
    });

    function formatCurrency(val) {
        if (isNaN(val)) return "0.00";
        return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function generateDailyReport() {
        const month = document.getElementById('dailyMonth').value;
        const date = document.getElementById('dailyDate').value;
        const outlet = document.getElementById('dailyOutlet').value;

        const cashPos = parseFloat(document.getElementById('cashPos').value) || 0;
        const totalNetSales = parseFloat(document.getElementById('totalNetSales').value) || 0;
        const grabFood = parseFloat(document.getElementById('grabFood').value) || 0;
        const foodPanda = parseFloat(document.getElementById('foodPanda').value) || 0;
        const commRate = parseFloat(document.getElementById('commRate').value) || 0.68;
        const floatMoney = document.getElementById('floatMoney').value;

        const prevMtdInStore = parseFloat(document.getElementById('prevMtdInStore').value) || 0;
        const prevMtdTotal = parseFloat(document.getElementById('prevMtdTotal').value) || 0;

        const extra = document.getElementById('extra').value;
        const shortage = document.getElementById('shortage').value;

        const yestBal = parseFloat(document.getElementById('yestBal').value) || 0;
        const todayCook = parseFloat(document.getElementById('todayCook').value) || 0;
        const todayUsed = parseFloat(document.getElementById('todayUsed').value) || 0;

        const deliveryBefore = grabFood + foodPanda;
        const deliveryAfter = deliveryBefore * commRate;
        const netSalesCalc = totalNetSales - deliveryBefore;
        const newMtdInStore = prevMtdInStore + netSalesCalc;
        const dailyGross = netSalesCalc + deliveryAfter;
        const newMtdTotal = prevMtdTotal + dailyGross;

        const totalRice = yestBal + todayCook;
        const todayBal = totalRice - todayUsed;

        // Standardized spacing for equations with spaces around '+' and '-'
        const template = `Month : ${month}
Date : ${date}
Outlet: ${outlet}

*1) In Store Sales* 
==============  
Cash POS Sales: $${formatCurrency(cashPos)}

Total In Store Sales:
Net sales - E delivery (Before Commission) 
$${formatCurrency(totalNetSales)} - $${formatCurrency(deliveryBefore)} = $${formatCurrency(netSalesCalc)}

Month To Date Sales:   
$${formatCurrency(prevMtdInStore)} + $${formatCurrency(netSalesCalc)} = $${formatCurrency(newMtdInStore)}
(add daily)


*2) E-Delivery Sale*
==============

Total E-Delivery Sales
$${formatCurrency(deliveryAfter)} *(After Commission)*
$${formatCurrency(deliveryBefore)} *(Before Commission)*

 *Total Gross Sales*
=============
Daily sales + Edelivery (After Commission)
$${formatCurrency(netSalesCalc)} + $${formatCurrency(deliveryAfter)} = $${formatCurrency(dailyGross)}

MTD Total   Sales:  
$${formatCurrency(prevMtdTotal)} + $${formatCurrency(dailyGross)} = $${formatCurrency(newMtdTotal)}

Float money : $${floatMoney} ✅
Extra : ${extra}
Shortage: ${shortage}

Yesterday balance: ${yestBal}
Today cook: ${todayCook}
Total rice: ${Number(totalRice.toFixed(2))}
Today used: ${todayUsed}
Today balance: ${Number(todayBal.toFixed(2))}`;

        document.getElementById('outputDaily').value = template;
    }

    function generateLunchReport() {
        const date = document.getElementById('lunchDate').value;
        const time = document.getElementById('lunchTime').value;
        const outlet = document.getElementById('lunchOutlet').value;

        const inHouse = parseFloat(document.getElementById('lunchInHouse').value) || 0;
        const foodpanda = parseFloat(document.getElementById('lunchFoodpanda').value) || 0;
        const grab = parseFloat(document.getElementById('lunchGrab').value) || 0;
        
        const rating = document.getElementById('lunchRating').value;
        const newReviews = document.getElementById('lunchNewReviews').value;
        
        let monthNameStr = "NOVEMBER";
        const parts = date.split('/');
        if(parts.length === 3) {
            const mIndex = parseInt(parts[1], 10) - 1;
            if(!isNaN(mIndex) && mIndex >= 0 && mIndex <= 11) {
                monthNameStr = monthsNames[mIndex].toUpperCase();
            }
        }
        
        const incidents = document.getElementById('lunchIncidents').value;
        const totalSales = inHouse + foodpanda + grab;

        // Standardized spacing for lunch report
        const template = `Daily Sales After Lunch
Outlet - ${outlet}
Date - ${date}
Time - ${time}

Sales In House : $${formatCurrency(inHouse)}
Foodpanda : $${formatCurrency(foodpanda)}
(after commission)
Grab : $${formatCurrency(grab)}
(after commission)

Total Sales : $${formatCurrency(totalSales)}

⭐ Google Review Rating: ${rating}
📝 New Google Reviews in ${monthNameStr}: ${newReviews}
🚨 ${monthNameStr} Online Incidents: ${incidents}`;

        document.getElementById('outputLunch').value = template;
    }

    function copyToClipboard(elementId) {
        const textarea = document.getElementById(elementId);
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(textarea.value);

        const toastId = elementId === 'outputDaily' ? 'toastDaily' : 'toastLunch';
        const toast = document.getElementById(toastId);
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 2000);
    }
</script>

</body>
</html>
